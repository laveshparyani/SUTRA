<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b2447"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#0b2447">SUTRA — Workflow &amp; Integration Diagram</text>
  <text x="40" y="82" font-size="16" fill="#475569">Statewide Unified Tracking, Registry &amp; Analytics · Hybrid Model 1 (Registry &amp; GIS) + Model 3 (Federation &amp; Middleware) · Gujarat Police CCTV Integration Hackathon 2026</text>

  <!-- ===== SOURCES (left) ===== -->
  <rect x="40" y="130" width="330" height="520" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="162" font-size="18" font-weight="700" fill="#0b2447">Heterogeneous camera sources</text>
  <text x="60" y="184" font-size="13" fill="#475569">26 departments · analog + IP · many VMS vendors</text>

  <g font-size="13" fill="#0f172a">
    <rect x="60" y="205" width="290" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="74" y="229" font-weight="600">Challenge portal (Sentinel Camera Grid)</text>
    <text x="74" y="249" fill="#475569">30 cameras · credentialed RTSP (H.264/H.265) · HLS fallback</text>

    <rect x="60" y="280" width="290" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="74" y="304" font-weight="600">Departmental VMS / NVR</text>
    <text x="74" y="324" fill="#475569">RTSP · ONVIF · vendor SDK (adapter modules)</text>

    <rect x="60" y="355" width="290" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="74" y="379" font-weight="600">Private / society / commercial cameras</text>
    <text x="74" y="399" fill="#475569">RTSP or HTTP, onboarded via API, CSV or UI</text>

    <rect x="60" y="430" width="290" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="74" y="454" font-weight="600">Recorded footage</text>
    <text x="74" y="474" fill="#475569">file sources for investigation and replay</text>
  </g>
  <text x="60" y="530" font-size="13" fill="#475569">Video never leaves the edge. Only metadata,</text>
  <text x="60" y="550" font-size="13" fill="#475569">plate reads and evidence crops travel upward.</text>
  <text x="60" y="590" font-size="13" fill="#475569">Source credentials live only in the edge</text>
  <text x="60" y="610" font-size="13" fill="#475569">node's environment; the registry stores</text>
  <text x="60" y="630" font-size="13" fill="#475569">credential-free URLs.</text>

  <!-- arrows sources -> edge -->
  <line x1="370" y1="236" x2="430" y2="236" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="311" x2="430" y2="311" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="386" x2="430" y2="386" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="370" y1="461" x2="430" y2="461" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== EDGE NODE (middle) ===== -->
  <rect x="430" y="130" width="520" height="520" rx="14" fill="#eef4ff" stroke="#93b4e6"/>
  <text x="450" y="162" font-size="18" font-weight="700" fill="#0b2447">Edge node — ingest + inference (per district / department)</text>
  <text x="450" y="184" font-size="13" fill="#475569">Commodity CPU server · no GPU · FFmpeg + ONNX Runtime</text>

  <g font-size="13" fill="#0f172a">
    <rect x="450" y="205" width="480" height="92" rx="8" fill="#ffffff" stroke="#5b8fb9"/>
    <text x="464" y="229" font-weight="700" fill="#1d4ed8">SUTRA Bridge — source adapters &amp; scheduler</text>
    <text x="464" y="250" fill="#475569">One adapter contract: discover · probe · open_stream · health</text>
    <text x="464" y="268" fill="#475569">Adaptive ingest scheduler: concurrency budget, dwell rotation, pinning,</text>
    <text x="464" y="286" fill="#475569">alert-boost of the hit camera and its neighbours · honest per-camera health</text>

    <rect x="450" y="312" width="480" height="92" rx="8" fill="#ffffff" stroke="#5b8fb9"/>
    <text x="464" y="336" font-weight="700" fill="#1d4ed8">SUTRA Insight — AI analytics</text>
    <text x="464" y="357" fill="#475569">ANPR: YOLOv9-t plate detection → CCT OCR → temporal voting → Indian-plate</text>
    <text x="464" y="375" fill="#475569">normalisation and state-code repair · 30–75 ms/frame on CPU</text>
    <text x="464" y="393" fill="#475569">Scene analytics: YOLOX-nano person / vehicle counts · evidence crop per read</text>

    <rect x="450" y="419" width="480" height="92" rx="8" fill="#ffffff" stroke="#5b8fb9"/>
    <text x="464" y="443" font-weight="700" fill="#1d4ed8">SUTRA Watch — matching &amp; alerting</text>
    <text x="464" y="464" fill="#475569">Every read cross-referenced against the watchlist: exact match, or fuzzy</text>
    <text x="464" y="482" fill="#475569">(confusion-fold, edit distance 1) labelled "probable" with raw characters shown</text>
    <text x="464" y="500" fill="#475569">Alert episodes with cooldown · annotated evidence frame · acknowledgement</text>
  </g>

  <rect x="450" y="530" width="480" height="96" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="464" y="554" font-size="13" font-weight="700" fill="#c2410c">Edge → central sync (every 30 s, resumable)</text>
  <text x="464" y="575" font-size="13" fill="#7c2d12">Cameras, detections, alerts and evidence crops only — never video.</text>
  <text x="464" y="593" font-size="13" fill="#7c2d12">Shared-secret channel, cursor survives restarts, duplicates collapsed.</text>
  <text x="464" y="611" font-size="13" fill="#7c2d12">Bandwidth scales with events, not with streams → viable at 80,000 cameras.</text>

  <!-- arrow edge -> central -->
  <line x1="950" y1="390" x2="1030" y2="390" stroke="#c2410c" stroke-width="3" marker-end="url(#arrowAmber)"/>
  <text x="962" y="378" font-size="12" fill="#c2410c" font-weight="600">metadata</text>

  <!-- ===== CENTRAL TIER (right) ===== -->
  <rect x="1030" y="130" width="530" height="520" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="1050" y="162" font-size="18" font-weight="700" fill="#0b2447">Central tier — command centre (hosted, 102 MB)</text>
  <text x="1050" y="184" font-size="13" fill="#475569">No video decode · registry, alerts, trace, evidence, reports · PostgreSQL</text>

  <g font-size="13" fill="#0f172a">
    <rect x="1050" y="205" width="490" height="108" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="1064" y="229" font-weight="700" fill="#047857">SUTRA Atlas — Model 1 registry &amp; GIS foundation (mandatory)</text>
    <text x="1064" y="250" fill="#475569">Camera registry: location, department, type, ownership, connectivity,</text>
    <text x="1064" y="268" fill="#475569">storage, retention, install date · manual / API / bulk-CSV / auto-discovery</text>
    <text x="1064" y="286" fill="#475569">GIS map layered by department, type, status, live health · gap &amp; ageing</text>
    <text x="1064" y="304" fill="#475569">analysis · role-based search, CSV export · full metadata audit trail</text>

    <rect x="1050" y="328" width="490" height="108" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="1064" y="352" font-weight="700" fill="#047857">SUTRA Command — control-room UI (React + Leaflet)</text>
    <text x="1064" y="373" fill="#475569">Video wall (relayed once per camera, never fanned out to sources)</text>
    <text x="1064" y="391" fill="#475569">Real-time alert centre with evidence · Vehicle Trace: timestamped,</text>
    <text x="1064" y="409" fill="#475569">location-wise movement history drawn on the GIS map · detections</text>
    <text x="1064" y="427" fill="#475569">browser · watchlist manager · output report export (UTC + IST)</text>

    <rect x="1050" y="451" width="490" height="90" rx="8" fill="#ffffff" stroke="#34d399"/>
    <text x="1064" y="475" font-weight="700" fill="#047857">Government database connectors (integration-ready)</text>
    <text x="1064" y="496" fill="#475569">Connector interface with a VAHAN-shaped representative dataset today;</text>
    <text x="1064" y="514" fill="#475569">VAHAN · SARTHI · eGujCop (CCTNS) · AFIS / NAFIS are connector swaps</text>
    <text x="1064" y="532" fill="#475569">Alerts enriched with vehicle details; owner identity masked by role</text>
  </g>

  <rect x="1050" y="556" width="490" height="70" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="1064" y="580" font-size="13" font-weight="700" fill="#b91c1c">Security &amp; auditability</text>
  <text x="1064" y="600" font-size="13" fill="#7f1d1d">JWT + department-scoped RBAC (admin / operator / viewer) · HttpOnly media</text>
  <text x="1064" y="618" font-size="13" fill="#7f1d1d">tokens · login rate limiting · authenticated evidence store · audit log · CI security scans</text>

  <!-- ===== WORKFLOW STRIP (bottom) ===== -->
  <text x="40" y="700" font-size="20" font-weight="700" fill="#0b2447">Operational workflow — from onboarding to a traced vehicle</text>

  <g font-size="13">
    <rect x="40" y="720" width="235" height="120" rx="10" fill="#0b2447"/>
    <text x="56" y="746" fill="#fbbf24" font-weight="700" font-size="14">1 · Onboard</text>
    <text x="56" y="770" fill="#ffffff">Discover the portal catalogue or</text>
    <text x="56" y="788" fill="#ffffff">import CSV / API; every camera</text>
    <text x="56" y="806" fill="#ffffff">gets a registry row, coordinates,</text>
    <text x="56" y="824" fill="#ffffff">department and health state.</text>

    <rect x="300" y="720" width="235" height="120" rx="10" fill="#0b2447"/>
    <text x="316" y="746" fill="#fbbf24" font-weight="700" font-size="14">2 · Ingest</text>
    <text x="316" y="770" fill="#ffffff">Scheduler opens streams within</text>
    <text x="316" y="788" fill="#ffffff">the budget (RTSP over TCP,</text>
    <text x="316" y="806" fill="#ffffff">credentials injected at open),</text>
    <text x="316" y="824" fill="#ffffff">samples ~1 frame/s per camera.</text>

    <rect x="560" y="720" width="235" height="120" rx="10" fill="#0b2447"/>
    <text x="576" y="746" fill="#fbbf24" font-weight="700" font-size="14">3 · Analyse</text>
    <text x="576" y="770" fill="#ffffff">Plates detected, read and voted</text>
    <text x="576" y="788" fill="#ffffff">across frames; person / vehicle</text>
    <text x="576" y="806" fill="#ffffff">counts per scene; each read keeps</text>
    <text x="576" y="824" fill="#ffffff">its evidence crop and confidence.</text>

    <rect x="820" y="720" width="235" height="120" rx="10" fill="#0b2447"/>
    <text x="836" y="746" fill="#fbbf24" font-weight="700" font-size="14">4 · Correlate &amp; alert</text>
    <text x="836" y="770" fill="#ffffff">Reads matched to the watchlist</text>
    <text x="836" y="788" fill="#ffffff">and enriched from the vehicle DB;</text>
    <text x="836" y="806" fill="#ffffff">a hit raises a real-time alert and</text>
    <text x="836" y="824" fill="#ffffff">boosts neighbouring cameras.</text>

    <rect x="1080" y="720" width="235" height="120" rx="10" fill="#0b2447"/>
    <text x="1096" y="746" fill="#fbbf24" font-weight="700" font-size="14">5 · Trace &amp; report</text>
    <text x="1096" y="770" fill="#ffffff">Given a registration number,</text>
    <text x="1096" y="788" fill="#ffffff">SUTRA reconstructs the route with</text>
    <text x="1096" y="806" fill="#ffffff">timestamps on the GIS map and</text>
    <text x="1096" y="824" fill="#ffffff">exports the output report (CSV).</text>

    <rect x="1340" y="720" width="220" height="120" rx="10" fill="#c2410c"/>
    <text x="1356" y="746" fill="#ffffff" font-weight="700" font-size="14">Scale-out</text>
    <text x="1356" y="770" fill="#ffffff">Edge → regional → central.</text>
    <text x="1356" y="788" fill="#ffffff">Add an edge node per district;</text>
    <text x="1356" y="806" fill="#ffffff">central grows with events, not</text>
    <text x="1356" y="824" fill="#ffffff">streams. Target: ~80,000 cameras.</text>
  </g>
  <line x1="275" y1="780" x2="300" y2="780" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="780" x2="560" y2="780" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="795" y1="780" x2="820" y2="780" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1055" y1="780" x2="1080" y2="780" stroke="#0b2447" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="40" y="900" font-size="13" fill="#475569">Everything shown is running code: hosted central tier at sutra-central.onrender.com, edge node on the challenge portal's cameras, 175 automated tests, 31 recorded acceptance checks.</text>
  <text x="40" y="922" font-size="13" fill="#475569">Repository: github.com/laveshparyani/SUTRA · Team: Lavesh Paryani, Hiral Kotwani · Full architecture and sizing in SUTRA_HLD.pdf</text>
</svg>
