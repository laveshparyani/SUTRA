[pytest]
# Pins rootdir to backend/ however pytest is invoked (`pytest`, `pytest tests`,
# `pytest tests/test_x.py`), so backend/conftest.py — the network-isolation
# shim — is always loaded before the app is imported.
testpaths = tests
# a hung WebSocket or a worker that never returns must fail, not stall CI
timeout = 120
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning
