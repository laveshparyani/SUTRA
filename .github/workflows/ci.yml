name: CI

# Every push and every PR is tested. Deployment workflows depend on this
# passing, so nothing unverified can reach staging or production.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: System deps (OpenCV runtime)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Test (ANPR correctness + security properties)
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Known-vulnerable dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln GHSA-4xh5-x5gv-qwph || true

      - name: Secret scan of full history (fails on a committed credential)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz             | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    # The browser suite drives the built bundle, so it only runs once the
    # frontend build has produced one. Kept a separate job so a browser
    # failure is distinguishable from an API or build failure at a glance.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: System deps (OpenCV runtime)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: End-to-end tests
        run: python -m pytest e2e -q

      - name: Server log on failure
        if: failure()
        run: |
          echo "The e2e server writes to its temp data directory; the fixture"
          echo "surfaces the tail of that log in the failure message above."
